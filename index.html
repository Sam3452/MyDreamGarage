<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">

</head>
  
<body>
<div class="container">
<nav class="navbar">
    <div class="nav-icon-spacer"></div>
    <h1 class="nav-logo">MyDreamGarage</h1>
    <div class="nav-icons">
        <span class="nav-icon" title="Favourites">☆</span>
        <span class="nav-icon" title="Garages">⚙</span>
    </div>
</nav>

<div class="controls-bar">
    <input type="text" id="car-search" placeholder="Search for a car...">
    <select id="manufacturer-filter">
        <option value="">All Manufacturers</option>
    </select>

</div>


</div>

<div class="container" id="car-container">
</div>

<div class="pagination">
    <button id="prev-page">Previous</button>
    <span id="page-info">Page 1</span>
    <button id="next-page">Next</button>
</div>

<div id="car-info">
    <div id="info-content"></div>
</div>


<script src="script.js"></script>
</body>


</html>
